version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    # The modbus integration's requirements: they follow the Home Assistant version that
    # pytest-homeassistant-custom-component pins, not their own releases.
    ignore:
      - dependency-name: modbus-connection
      - dependency-name: pymodbus
      - dependency-name: tmodbus
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
