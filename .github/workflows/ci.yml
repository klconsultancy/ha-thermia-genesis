name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  # HACS and hassfest validate against rules that change without a commit here.
  schedule:
    - cron: "41 3 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ruff, mypy and pytest, from the organization's reusable workflow. It also fails when the
  # uv version differs between the dev container, pyproject.toml and the prek hook: Renovate
  # groups them (renovate.json), this catches drift.
  python:
    permissions:
      contents: read
    uses: klconsultancy/workflows/.github/workflows/python-uv.yml@153c11cfe93c94e30a657a6d43f55ec44e6e13b8 # v1.0.1
    with:
      python-version: "3.14" # same as the devcontainer
      test-python-versions: '["3.14"]'
      check-uv-pins: true

  home-assistant:
    permissions:
      contents: read
    uses: klconsultancy/workflows/.github/workflows/home-assistant.yml@153c11cfe93c94e30a657a6d43f55ec44e6e13b8 # v1.0.1

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # Single required status check for the branch ruleset. A reusable workflow's job reports
  # the result of all its own jobs.
  ci-success:
    name: CI success
    if: always()
    needs: [python, home-assistant, dependency-review]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
