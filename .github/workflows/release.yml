name: Release

# release-please keeps a release pull request open with the next version and its changelog,
# from the Conventional Commits titles on main. Merging it tags the release and creates the
# GitHub Release HACS installs from. Both run in the organization's reusable workflow, as
# the release app.
#
# A release candidate is a tag such as v0.3.0-rc.1 on main, pushed by an admin (the
# "release tags" ruleset): the reusable workflow turns it into a GitHub pre-release, which
# HACS offers to users who enabled beta versions. release-please doesn't see it, so the
# final release's notes still cover everything since the last stable release.
#
# Every release and release candidate gets thermia_genesis.zip, which HACS installs
# (`zip_release` in hacs.json): the integration's files at the zip's root, with the tag's
# version in manifest.json. In the repository the manifest only changes with a release
# pull request, so an rc's own checkout still says the last stable version. A release and an
# rc's pre-release stay a draft until the zip is attached, and are published only then
# ("draft" and "force-tag-creation" in release-please-config.json); one whose zip fails
# stays a draft: fix the cause and re-run the failed jobs.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions: {}

jobs:
  release:
    permissions: {} # its jobs act as the app
    uses: klconsultancy/workflows/.github/workflows/release-please.yml@153c11cfe93c94e30a657a6d43f55ec44e6e13b8 # v1.0.1
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
      create-prerelease: true
      assets-command: |
        cd custom_components/thermia_genesis
        jq --arg version "${TAG#v}" '.version = $version' manifest.json > manifest.json.new
        mv manifest.json.new manifest.json
        zip -r -X ../../thermia_genesis.zip . -x '*/__pycache__/*'
      assets: thermia_genesis.zip
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
