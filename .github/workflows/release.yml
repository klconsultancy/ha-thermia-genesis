name: Release

# release-please keeps a release pull request open with the next version and its changelog,
# from the Conventional Commits titles on main. Merging it tags the release and creates the
# GitHub Release HACS installs from.
#
# A release candidate is a tag such as v0.3.0-rc.1 on main, pushed by an admin (the
# "release tags" ruleset): it becomes a GitHub pre-release, which HACS offers to users who
# enabled beta versions. release-please doesn't see it, so the final release's notes still
# cover everything since the last stable release.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      # A GitHub App token instead of GITHUB_TOKEN, so CI runs on the release PR.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # HACS installs from the GitHub Release that merging the release PR creates.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  release-candidate:
    name: Release candidate
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the pre-release
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists already."
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --generate-notes --title "$TAG"
