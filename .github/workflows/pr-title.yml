name: PR title

# The title becomes the squash commit on main, from which release-please derives the next
# version and the changelog. The check is the shared one in klconsultancy/workflows; it
# runs on pull_request, not pull_request_target, which GitHub blocks by default in public
# repositories.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # A required check of the merge queue: it must report on the queue's merge group too.
  # The title was checked on the pull request; the group has none to check.
  merge_group:

permissions: {}

jobs:
  title:
    name: PR title
    permissions:
      pull-requests: read
    uses: klconsultancy/workflows/.github/workflows/pr-title.yml@153c11cfe93c94e30a657a6d43f55ec44e6e13b8 # v1.0.1
